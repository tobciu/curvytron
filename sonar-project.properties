# SonarQube: https://sonarqube.tobciu08.de/dashboard?id=curvytron
# Scans run via tools/pre-pr-check.sh (local, branch local/<branch>) and the CI on main.
sonar.projectKey=curvytron
sonar.projectName=curvytron

sonar.sources=src,tools
sonar.tests=tests
sonar.exclusions=src/client/views/**,src/client/index.html,**/*.scss
sonar.test.inclusions=tests/**,*.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Unit-test coverage measures the game logic; the Vue UI, canvas/rendering, sound and
# browser-integration layers are verified by the Playwright E2E suite (tests/e2e), and
# the scripts in tools/ are run manually, so they are not unit-coverage targets.
sonar.coverage.exclusions=src/client/views/**,src/client/components/**,src/client/App.vue,src/client/main.ts,src/client/core/Canvas.ts,src/client/animation/**,src/client/lib/SpriteAsset.ts,src/client/service/SoundManager.ts,src/client/service/Notifier.ts,src/client/service/ActivityWatcher.ts,src/client/services.ts,src/server/launcher.ts,tools/**

# Note on S2245 (Math.random): the only security-relevant use (private room passwords) was
# switched to crypto.getRandomValues. The remaining uses are game logic and visual effects;
# like all security hotspots they cannot be excluded via sonar.issue.ignore.multicriteria
# and must be reviewed (marked "Safe") in the SonarQube UI.

# The scanner waits for the quality gate result instead of only uploading.
sonar.qualitygate.wait=true
