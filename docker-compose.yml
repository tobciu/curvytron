services:
  curvytron:
    image: ghcr.io/tobciu/curvytron:latest
    # To build from local source instead of pulling, comment the `image:` line
    # above and uncomment this:
    # build:
    #   context: .
    #   target: runtime
    restart: unless-stopped
    ports:
      - "8080:8080"
    # config.json is optional — the server defaults to port 8080, inspector off.
    # To supply one, create ./config.json first, then uncomment:
    # volumes:
    #   - ./config.json:/app/config.json:ro
