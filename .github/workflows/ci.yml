name: CI

# Only for pull requests (a push to a branch alone does not run it, and not twice for a branch with a PR)
on:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-24.04 # not ubuntu-latest: Playwright does not support the Ubuntu 26.04 image yet
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: node --version
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npx playwright test --project=functional
            # Screenshots depend on the fonts and the browser build: informative only
            - run: npx playwright test --project=visual
              continue-on-error: true
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-results
                  path: test-results/
