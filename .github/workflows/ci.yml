name: CI

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: node --version
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npx playwright test --project=functional
            # Screenshots depend on the fonts and the browser build: informative only
            - run: npx playwright test --project=visual
              continue-on-error: true
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-results
                  path: test-results/
            # Baseline-Analyse von main (neuer Code der lokalen Scans in tools/pre-pr-check.sh
            # vergleicht gegen main). Dafür das GitHub-Secret SONAR_TOKEN anlegen.
            - name: SonarQube (main)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              continue-on-error: true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: https://sonarqube.tobciu08.de
              run: npx --yes @sonar/scan -Dsonar.qualitygate.wait=false
